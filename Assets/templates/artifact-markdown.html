<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | html.escape }}{{ if artifact.caption != "" }} &mdash; {{ artifact.caption | html.escape }}{{ end }}</title>
  {{ include 'opengraph' }}
  <link rel="stylesheet" href="{{ prefix }}js/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="{{ prefix }}css/site.css">
</head>
<body class="artifact-markdown">
  {{ include 'header' }}

  <div class="container pt-4">
    <article class="markdown-body">
      {{ artifact.html_content }}
    </article>

    <div class="artifact-meta border-top mt-4 pt-3">
      <span class="badge badge-type text-white">{{ artifact.badge | html.escape }}</span>
      {{ if artifact.credit != "" }}<span class="text-muted small ms-2">{{ artifact.credit | html.escape }}</span>{{ end }}
      {{ if artifact.date != "" }}<span class="text-muted small ms-2">{{ artifact.date | html.escape }}</span>{{ end }}
    </div>
  </div>

  {{ include 'footer' }}
  <script src="{{ prefix }}js/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
