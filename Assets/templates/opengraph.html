  {{~ # Open Graph — said in a template comment rather than an HTML one, so the label doesn't ~}}
  {{~ # go out on every page of every site to explain four tags to nobody. ~}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ og_title | html.escape }}">
  {{ if og_description != "" }}<meta property="og:description" content="{{ og_description | html.escape }}">{{ end }}
  {{ if site.url != "" && og_image != "" }}<meta property="og:image" content="{{ site.url | html.escape }}/{{ og_image | html.escape }}">{{ end }}
